[package]
name = "payment_adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1.88"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2.0"
x509-parser = "0.16"
