[package]
name = "storage_adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"

[dependencies]
async-trait = "0.1.88"
aws-credential-types = "1.2.3"
aws-sigv4 = "1.3.5"
base64 = "0.22.1"
chrono = "0.4"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0"
urlencoding = "2.1.3"
