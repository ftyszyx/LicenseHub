name: licensehub

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_ALIYUN_DEBIAN_MIRROR: ${USE_ALIYUN_DEBIAN_MIRROR:-1}
        USE_ALIYUN_CRATES_MIRROR: ${USE_ALIYUN_CRATES_MIRROR:-1}
    image: licensehub-server:local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${LISTEN_OUT_PORT:-21600}:${LISTEN_PORT:-3000}"
    volumes:
      - ./deploy/server/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${LISTEN_PORT:-3000}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./deploy/postgres/data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./deploy/redis/data:/data
