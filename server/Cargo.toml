[package]
name = "app_server"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"

[lib]
name = "app_server"
path = "src/lib.rs"

[[bin]]
name = "app_server"
path = "src/main.rs"

[dependencies]
# 异步
tokio = { version = "1.46.0", features = ["full"] }
# web框架
# https://salvo.rs/zh-hans/guide/quick-start.html
salvo = { version = "0.84", features = [
    "logging",
    "oapi",
    "anyhow",
    "cors",
    "affix-state",
    "test",
] }
salvo-oapi = { version = "0.84", features = ["swagger-ui"] }
#utoipa = { version = "5.0.0", features = ["chrono"] } 
# 序列化
serde = { version = "1.0.219", features = ["derive"] }
# 中间件
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
# 日志 
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 环境变量
dotenvy = "0.15.7"
# 数据库
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
sea-orm = { version = "1.1.13", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "debug-print",
] }

bytes = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"

#其它
bcrypt = "0.17.0"
jsonwebtoken = "9.3"
chrono = "0.4"
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
url = "2.5"
validator = { version = "0.20.0", features = ["derive"] }
futures = "0.3.31"
redis = { version = "0.32.4", features = ["tokio-comp", "json", "aio"] }
http-body-util = "0.1"
async-trait = { version = "0.1.88" }
# 本地依赖
data_model = { path = "crates/data_model" }
payment_adapter = { path = "crates/payment" }
storage_adapter = { path = "crates/storage" }
anyhow = "1.0.100"
once_cell = "1.21.3"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
tower-service = "0.3"
hyper = { version = "1.0", features = ["full"] }
mime = "0.3"

[workspace]
members = ["crates/data_model", "crates/payment", "crates/storage"]
